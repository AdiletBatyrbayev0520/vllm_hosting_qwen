services:
  qwen3-vl-server:
    image: vllm/vllm-openai:latest
    container_name: qwen3-vl-vllm
    runtime: nvidia # Ensures GPU access
    ipc: host       # Required for vLLM shared memory performance
    ports:
      - "8000:8000"
    volumes:
      # Mounts a local cache so you don't redownload the model on every restart
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      # - HUGGING_FACE_HUB_TOKEN=your_token_here # Uncomment if using a gated model
      - CUDA_VISIBLE_DEVICES=0,1 # Change to "0,1" etc., if using multiple GPUs
      - HF_TOKEN=${HF_TOKEN}
    command: >
      --model Qwen/Qwen3-VL-8B-Instruct
      --trust-remote-code
      --max-model-len 16384
      --dtype auto
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [gpu]
  
  # gemma-4-server:
